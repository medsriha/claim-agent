[project]
name = "claim-agent"
version = "0.1.0"
description = "Damaged-in-transit claims agent — backend API for ShipBob support reps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_agent"]

# ---------------------------------------------------------------------------
# Lint & format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "ARG",       # unused arguments
    "PTH",       # pathlib
    "ANN",       # type annotations
    "S",         # bandit (security)
    "ASYNC",     # async correctness
    "T20",       # no print() — use structured logging
    "PT",        # pytest style
    "RUF",       # ruff-specific
]
ignore = [
    "E501",      # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG"]   # asserts and fixtures are fine in tests
# A command-line tool's output is its interface, so printing is the point of it. The rule
# stays on everywhere else, including the rest of `tools/` — the stand-in API is a server
# and has no business printing. Granted one file at a time, deliberately.
"tools/seed_merchant_memory.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "tools"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_anthropic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=claim_agent",
    "--cov-report=term-missing",
]
markers = [
    "integration: exercises the app through its HTTP surface",
]

[tool.coverage.run]
source = ["src/claim_agent"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
