name: claim-agent

services:
  mock:
    build: .
    command: ["uvicorn", "tools.shipbob_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      SHIPBOB_MOCK_DELAY_SECONDS: "${SHIPBOB_MOCK_DELAY_SECONDS:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/cases', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build: .
    depends_on:
      mock:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SHIPBOB_BASE_URL: http://mock:8080
      DATABASE_PATH: /data/claim_agent.db
      ATTACHMENT_CACHE_DIR: /cache
      SEED_DEMO_DATA: "true"
    volumes:
      - claim-data:/data
      - attachment-cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  claim-data:
  attachment-cache:
